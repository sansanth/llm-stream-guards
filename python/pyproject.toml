[project]
name = "llm-stream-guards"
# One place: `__version__` in src/llm_stream_guards/__init__.py; hatchling reads it at build time.
dynamic = ["version"]
description = "Deterministic output guards for a streamed LLM reply: untrusted links, made-up emails, phone numbers and prices, quoted system prompts and code, stopped before they reach the screen."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sandhu Santhakumar", email = "code@sandhu.sh" }]
requires-python = ">=3.11"
dependencies = []
keywords = ["llm", "streaming", "guardrails", "prompt-injection", "output-filter", "chatbot", "security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Text Processing :: Filters",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/sansanth/llm-stream-guards"
Issues = "https://github.com/sansanth/llm-stream-guards/issues"
Changelog = "https://github.com/sansanth/llm-stream-guards/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/llm_stream_guards/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE"]

# The changelog and the test cases shared with the npm package live at the repository root.
[tool.hatch.build.targets.sdist.force-include]
"../CHANGELOG.md" = "CHANGELOG.md"
"../spec" = "spec"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["llm_stream_guards"]
branch = true

[tool.coverage.report]
fail_under = 95
show_missing = true

[tool.mypy]
strict = true
files = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
